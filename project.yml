name: AquaPulse
options:
  bundleIdPrefix: global.huy
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_CFBundleDisplayName: AquaPulse
    CODE_SIGNING_ALLOWED: NO
targets:
  AquaPulse:
    type: application
    platform: iOS
    sources: [AquaPulse]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: global.huy.AquaPulse
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: AquaPulse sends hydration and ritual reminders so you can keep your streaks.
