name: AquaPulse
options:
  bundleIdPrefix: global.huy
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_CFBundleDisplayName: AquaPulse
    DEVELOPMENT_TEAM: '337LP258Y2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
targets:
  AquaPulse:
    type: application
    platform: iOS
    sources:
      - path: AquaPulse
        excludes:
          - '**/.DS_Store'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: global.huy.AquaPulse
        PRODUCT_NAME: AquaPulse
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        DEVELOPMENT_TEAM: '337LP258Y2'
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: AquaPulse/AquaPulse.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: AquaPulse sends hydration and ritual reminders on this iPhone. Reminders are optional.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
    entitlements:
      path: AquaPulse/AquaPulse.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
schemes:
  AquaPulse:
    build:
      targets:
        AquaPulse: all
    run:
      config: Debug
    archive:
      config: Release
