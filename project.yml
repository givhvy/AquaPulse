name: AquaPulse
options:
  bundleIdPrefix: global.huy
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_CFBundleDisplayName: AquaPulse
    DEVELOPMENT_TEAM: '337LP258Y2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '4'
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
targets:
  AquaPulse:
    type: application
    platform: iOS
    sources:
      - path: AquaPulse
        excludes:
          - '**/.DS_Store'
          - Info.plist
      - path: AquaPulseShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: global.huy.AquaPulse
        PRODUCT_NAME: AquaPulse
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '4'
        DEVELOPMENT_TEAM: '337LP258Y2'
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: AquaPulse/AquaPulse.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: AquaPulse sends hydration and ritual reminders on this iPhone. Reminders are optional.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "AquaPulse App Store 3"
    info:
      path: AquaPulse/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: global.huy.AquaPulse
            CFBundleURLSchemes:
              - aquapulse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: AquaPulse/AquaPulse.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        keychain-access-groups:
          - $(AppIdentifierPrefix)global.huy.AquaPulse
    dependencies:
      - target: AquaPulseWidgets
  AquaPulseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AquaPulseWidgets
        excludes:
          - Info.plist
          - '*.entitlements'
      - path: AquaPulseShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: global.huy.AquaPulse.widget
        PRODUCT_NAME: AquaPulseWidgets
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AquaPulseWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: AquaPulseWidgets/AquaPulseWidgets.entitlements
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '4'
        DEVELOPMENT_TEAM: '337LP258Y2'
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
        INFOPLIST_KEY_CFBundleDisplayName: AquaPulse
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "AquaPulse Widget App Store 3"
    entitlements:
      path: AquaPulseWidgets/AquaPulseWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)global.huy.AquaPulse
schemes:
  AquaPulse:
    build:
      targets:
        AquaPulse: all
        AquaPulseWidgets: all
    run:
      config: Debug
    archive:
      config: Release
